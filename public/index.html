<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TugasKu</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <header class="hero">
    <div class="container">
      <h1>TugasKu</h1>
      <p> Kuliah tebal-tebal</p>
    </div>
  </header>

  <main class="container main">
    <div class="stats">
      <div class="stat"><div class="angka" id="statTotal">0</div><div class="label">Total</div></div>
      <div class="stat urgent"><div class="angka" id="statUrgent">0</div><div class="label">Urgent</div></div>
      <div class="stat terlambat"><div class="angka" id="statTerlambat">0</div><div class="label">Terlambat</div></div>
      <div class="stat selesai"><div class="angka" id="statSelesai">0</div><div class="label">Selesai</div></div>
    </div>

    <div class="form-card">
      <h2>➕ Tambah Tugas Baru</h2>
      <input id="mk" class="form-control mb-2" placeholder="Mata kuliah (contoh: Basis Data)">
      <input id="judul" class="form-control mb-2" placeholder="Judul tugas">
      <input id="deadline" type="datetime-local" class="form-control mb-3">
      <button id="btnTambah" class="btn-main">Tambah Tugas</button>
    </div>

    <div class="section-title">Daftar Tugas</div>
    <div id="daftar"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
