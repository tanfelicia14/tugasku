<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TugasKu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="mb-4">📚 TugasKu</h1>

    <div class="card p-3 mb-4">
      <input id="mk" class="form-control mb-2" placeholder="Mata kuliah">
      <input id="judul" class="form-control mb-2" placeholder="Judul tugas">
      <input id="deadline" type="datetime-local" class="form-control mb-2">
      <button id="btnTambah" class="btn btn-primary">Tambah Tugas</button>
    </div>

    <div id="daftar"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
